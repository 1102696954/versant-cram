<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versant 背题手册 · 语音版</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #6b7280;
    --accent: #2563eb; --accent-soft: #dbeafe; --border: #e5e7eb;
    --highlight: #fef3c7; --green: #059669;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); padding: 24px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  button { font-size: 14px; cursor: pointer; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.active-toggle { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .settings { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .settings label { display: flex; align-items: center; gap: 6px; }
  select, input[type="range"] { accent-color: var(--accent); }
  select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; max-width: 260px; }
  .val { min-width: 42px; display: inline-block; text-align: right; font-variant-numeric: tabular-nums; }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); }
  .status.playing { color: var(--green); font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; align-items: baseline; }
  .item:hover { background: #f9fafb; }
  .item.current { background: var(--highlight); border-color: #f59e0b; }
  .item .num { color: var(--muted); font-size: 12px; min-width: 28px; flex-shrink: 0; }
  .item .body { font-size: 14px; line-height: 1.55; }
  .q { font-weight: 600; }
  .a { color: #374151; margin-top: 2px; }
  .a::before { content: "→ "; color: var(--muted); }
  .group-title { font-size: 14px; font-weight: 700; color: var(--accent); margin: 14px 0 6px; }
  .story-title { font-size: 14px; font-weight: 700; color: var(--accent); margin: 14px 0 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  kbd { background: #e5e7eb; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
  .q, .a { display: flex; align-items: baseline; gap: 6px; }
  .q .txt, .a .txt { flex: 1; }
  .eye { flex-shrink: 0; cursor: pointer; font-size: 13px; opacity: .5; user-select: none; }
  .eye:hover { opacity: 1; transform: scale(1.15); }
  .q.masked .txt, .a.masked .txt { filter: blur(6px); user-select: none; transition: filter .15s; border-radius: 4px; }
  .q.masked .txt:hover, .a.masked .txt:hover { filter: blur(5px); }
  .q:not(.masked), .a:not(.masked) { cursor: pointer; }
  .mic { flex-shrink: 0; cursor: pointer; font-size: 13px; opacity: .5; user-select: none; }
  .mic:hover { opacity: 1; }
  .mic.listening { opacity: 1; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  .voice-result { margin-top: 4px; font-size: 13px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .voice-result:empty { display: none; }
  .heard-text { color: var(--green); font-style: italic; }
  .verdict.ok { color: var(--green); font-weight: 700; }
  .verdict.near { color: #d97706; font-weight: 700; }
  .verdict.bad { color: #dc2626; font-weight: 700; }
  .stats-row { display: flex; gap: 20px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; color: var(--muted); }
  .stat-num { font-weight: 700; font-size: 20px; display: block; }
  .stat-num.ok { color: var(--green); } .stat-num.near { color: #d97706; } .stat-num.bad { color: #dc2626; }
  .wrong-item { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; margin: 4px 0; font-size: 13px; }
  .wrong-item .wtxt { flex: 1; }
  .tips { background: #eff6ff; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #374151; margin-top: 12px; line-height: 1.6; }
  .explain-bar { margin-top: 4px; }
  .btn-xs { padding: 2px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; color: var(--muted); }
  .btn-xs:hover { background: #f3f4f6; color: var(--text); }
  .explain-box { margin-top: 6px; background: #fefce8; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 1.8; color: #374151; }
  .explain-box:empty { display: none; }
  .type-area { display: flex; gap: 6px; margin-top: 6px; }
  .type-area input { flex: 1; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .type-area input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  @media (max-width: 640px) {
    body { padding: 12px; }
    h1 { font-size: 19px; }
    .sub { font-size: 11px; }
    .controls .btn { padding: 10px 14px; font-size: 13px; }
    .settings { gap: 10px; }
    .eye, .mic { padding: 5px 8px; font-size: 16px; }
    .btn-xs { padding: 6px 12px; font-size: 14px; }
    .item { padding: 12px 10px; }
    .item .body { font-size: 15px; }
    .type-area input { font-size: 16px; padding: 8px 12px; }
    .wrong-item .btn { padding: 6px 10px; }
  }
</style>
</head>

    <label>答题停顿 <input type="range" id="gap" min="0" max="8" step="0.5" value="3"> <span class="val" id="gapVal">3.0s</span></label>
    <label>语音 <select id="voiceSel"></select></label>

</div>

// ---------- state ----------
let currentPart = 'partA';
let playing = false;
let paused = false;
let token = 0;          // cancellation token
let repeat = false;
let currentIndex = 0;   // index into flat visible list
let hideAnswers = localStorage.getItem('versant-maskMode') !== 'false'; // default: Q&A masked
const results = {};      // flatIndex -> 'ok' | 'near' | 'bad' (voice-answer results of current round)
let playIndices = null;  // sequence of flat indices to play (null = all)

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function getVoices() {
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
}
let voices = [];
function refreshVoices() {
  voices = getVoices();
  const sel = $('voiceSel');
  sel.innerHTML = '';
  if (voices.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = '(未检测到英语语音，将使用默认)';
    sel.appendChild(opt);
    return;
  }
  const preferred = ['Google US English', 'Samantha', 'Google UK English Female', 'Aaron', 'Karen', 'Daniel'];
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    let label = v.name + ' (' + v.lang + ')';
    opt.textContent = label;
    sel.appendChild(opt);
  });
  for (const name of preferred) {
    const idx = voices.findIndex(v => v.name === name);
    if (idx >= 0) { sel.value = String(idx); break; }
  }
}
speechSynthesis.onvoiceschanged = refreshVoices;
refreshVoices();

function speak(text) {
  return new Promise((resolve, reject) => {
    const u = new SpeechSynthesisUtterance(text);
    const v = voices[$('voiceSel').value];
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'en-US';
    u.rate = parseFloat($('rate').value);
    u.onend = () => resolve();
    u.onerror = e => e.error === 'interrupted' || e.error === 'canceled' ? resolve() : reject(e);
    speechSynthesis.speak(u);
  });
}

async function waitWhilePaused(myToken) {
  while (paused && myToken === token) await sleep(100);
}

// split long text into sentence chunks to avoid Chrome ~15s cutoff
function splitSentences(text) {
  return text.match(/[^.!?]+[.!?]+["']?\s*/g) || [text];
}

// ---------- flat list per part ----------
function buildFlat(part, scope) {
  const flat = [];
  if (part === 'partA' || part === 'partC') {
    DATA[part].items.forEach((it, i) => flat.push({ kind: 'qa', q: it.q, a: it.a, idx: i, exp: EXP[part][i] }));
  } else if (part === 'partB') {
    const groups = scope === 'all' ? DATA.partB.groups : [DATA.partB.groups[parseInt(scope)]];
    groups.forEach((g, gi) => g.items.forEach((s, i) => {
      const gIdx = scope === 'all' ? gi : parseInt(scope);
      flat.push({ kind: 'sentence', text: s, groupTitle: g.title, idx: i, exp: EXP.partB[gIdx][i] });
    }));
  } else if (part === 'partD') {
    DATA.partD.stories.forEach((st, si) => st.items.forEach((it, i) => flat.push({ kind: 'qa', q: it.q, a: it.a, storyTitle: st.title, idx: i, exp: EXP.partD[si][i] })));
  } else if (part === 'partF') {
    DATA.partF.items.forEach((it, i) => flat.push({ kind: 'qa', q: it.q, a: it.a, idx: i, exp: EXP.partF[i] }));
  }
  return flat;
}

function currentFlat() {
  return buildFlat(currentPart, $('scopeSel').value);
}

// ---------- rendering ----------
const PART_KEYS = ['partA', 'partB', 'partC', 'partD', 'partF'];

function renderTabs() {
  const tabs = $('tabs');
  tabs.innerHTML = '';
  PART_KEYS.forEach(k => {
    const b = document.createElement('button');
    b.className = 'tab' + (k === currentPart ? ' active' : '');
    b.textContent = DATA[k].title;
    b.onclick = () => { stop(); currentPart = k; currentIndex = 0; playIndices = null; resetResults(); renderScope(); renderList(); refreshStats(); };
    tabs.appendChild(b);
  });
}

  const sel = $('scopeSel');
  sel.innerHTML = '';
  if (currentPart === 'partB') {
    [['all', '全部 4 组'], ['0', '第一组'], ['1', '第二组'], ['2', '第三组'], ['3', '第四组']]
      .forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); });
  }

}

  const flat = currentFlat();
  let lastGroup = null;
  flat.forEach((it, i) => {
    const gt = it.groupTitle || it.storyTitle;
    if (gt && gt !== lastGroup) {
      lastGroup = gt;
      const h = document.createElement('div');
      h.className = it.groupTitle ? 'group-title' : 'story-title';
      h.textContent = gt;
      list.appendChild(h);
    }
    const div = document.createElement('div');
    div.className = 'item' + (i === currentIndex ? ' current' : '');
    div.dataset.i = i;
    const masked = hideAnswers; // all items (Q&A + sentences) are maskable
    let inner = '';
    if (it.kind === 'sentence') {
      inner = '<div class="num">' + (it.idx + 1) + '</div><div class="body">'
        + '<div class="q' + (masked ? ' masked' : '') + '"><span class="txt" title="点击朗读">' + esc(it.text) + '</span><span class="eye" title="显示/隐藏">' + (masked ? '👁' : '🙈') + '</span><span class="mic" title="语音回答">🎙</span></div>'
        + '<div class="voice-result"></div>'
        + '<div class="type-area" style="display:none"><input type="text" placeholder="输入英文答案，回车提交"><button class="btn-xs type-submit">✓</button></div>'
        + '<div class="explain-bar"><button class="btn-xs explain-btn">💡 讲解</button> <button class="btn-xs type-btn">✏️ 手写</button></div><div class="explain-box"></div></div>';
    } else {
      inner = '<div class="num">' + (it.idx + 1) + '</div><div class="body">'
        + '<div class="q' + (masked ? ' masked' : '') + '"><span class="txt" title="点击朗读">' + esc(it.q) + '</span><span class="eye" title="显示/隐藏">' + (masked ? '👁' : '🙈') + '</span></div>'
        + '<div class="a' + (masked ? ' masked' : '') + '"><span class="txt" title="点击朗读">' + esc(it.a) + '</span><span class="eye" title="显示/隐藏">' + (masked ? '👁' : '🙈') + '</span><span class="mic" title="语音回答">🎙</span></div>'
        + '<div class="voice-result"></div>'
        + '<div class="type-area" style="display:none"><input type="text" placeholder="输入英文答案，回车提交"><button class="btn-xs type-submit">✓</button></div>'
        + '<div class="explain-bar"><button class="btn-xs explain-btn">💡 讲解</button> <button class="btn-xs type-btn">✏️ 手写</button></div><div class="explain-box"></div></div>';
    }
    div.innerHTML = inner;
    div.onclick = () => { currentIndex = i; highlight(); play(); };
    // eye icon: toggle visibility; text click: reveal + speak (explanation)
    const qEl = div.querySelector('.q');
    const aEl = div.querySelector('.a');
    const wire = (el, text) => {
      if (!el) return;
      el.onclick = e => {
        e.stopPropagation();
        if (e.target.classList.contains('eye')) {
          el.classList.toggle('masked');
          const eye = el.querySelector('.eye');
          eye.textContent = el.classList.contains('masked') ? '👁' : '🙈';
        } else if (e.target.classList.contains('mic')) {
          // handled by mic handler
        } else {
          // text click: read aloud only — visibility is controlled solely by the eye button
          explain(text);
        }
      };
    };
    if (it.kind === 'sentence') {
      wire(qEl, it.text);
    } else {
      wire(qEl, it.q);
      wire(aEl, it.a);
    }
    // mic: voice answer with auto-scoring against the hidden expected text
    const micEl = div.querySelector('.mic');
    const resultEl = div.querySelector('.voice-result');
    if (micEl && resultEl && SR_SUPPORTED) {
      const expected = it.kind === 'sentence' ? it.text : it.a;
      micEl.onclick = e => { e.stopPropagation(); voiceAnswer(micEl, expected, resultEl, i); };
    } else if (micEl) {
      micEl.style.display = 'none';
    }
    // 💡 explanation button: show Chinese analysis + speak it with a Chinese voice
    const expBtn = div.querySelector('.explain-btn');
    const expBox = div.querySelector('.explain-box');
    if (expBtn && expBox && it.exp) {
      expBtn.onclick = e => {
        e.stopPropagation();
        if (expBox.textContent) {
          expBox.textContent = '';
          stop();
        } else {
          expBox.textContent = it.exp;
          speakCN(it.exp);
        }
      };
    } else if (expBtn) {
      expBtn.style.display = 'none';
    }
    // ✏️ typed answer: input box + same auto-grading as voice
    const typeBtn = div.querySelector('.type-btn');
    const typeArea = div.querySelector('.type-area');
    if (typeBtn && typeArea) {
      const input = typeArea.querySelector('input');
      const submit = typeArea.querySelector('.type-submit');
      const expected = it.kind === 'sentence' ? it.text : it.a;
      typeBtn.onclick = e => {
        e.stopPropagation();
        const show = typeArea.style.display === 'none';
        typeArea.style.display = show ? 'flex' : 'none';
        if (show) input.focus();
      };
      const doSubmit = () => {
        const text = input.value.trim();
        if (!text) return;
        gradeAnswer(text, expected, resultEl, i);
      };
      submit.onclick = e => { e.stopPropagation(); doSubmit(); };
      input.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') doSubmit(); };
    }
    list.appendChild(div);
  });
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlight() {
  document.querySelectorAll('.item').forEach(el => {
    const isCur = parseInt(el.dataset.i) === currentIndex;
    el.classList.toggle('current', isCur);
    if (isCur) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}

// ---------- speech recognition (voice answer) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_SUPPORTED = !!SR;
let recogActive = null;

const NUMWORDS = { zero: '0', one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', eleven: '11', twelve: '12', thirteen: '13', fourteen: '14', fifteen: '15', sixteen: '16', seventeen: '17', eighteen: '18', nineteen: '19', twenty: '20' };
const STOPWORDS = new Set(['a', 'an', 'the', 'is', 'are', 'to', 'of', 'and']);

function normWords(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9'\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ')
    .filter(Boolean).map(w => NUMWORDS[w] || w).filter(w => !STOPWORDS.has(w));
}

function lev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 1) return 2;
  const dp = Array.from({ length: m + 1 }, (_, i) => i);
  for (let j = 1; j <= n; j++) {
    let prev = dp[0]; dp[0] = j;
    for (let i = 1; i <= m; i++) {
      const tmp = dp[i];
      dp[i] = Math.min(dp[i] + 1, dp[i - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return dp[m];
}

function wordsMatch(w, x) {
  if (w === x) return true;
  if (w.length >= 4 && x.length >= 4 && lev(w, x) <= 1) return true;
  // plural / tense stems: applicants ~ applicant, goes ~ go
  const stem = s => s.replace(/(ies|es|s)$/, '');
  return stem(w) === stem(x);
}

function scoreAnswer(heard, expected) {
  const h = normWords(heard), e = normWords(expected);
  if (!e.length) return 1;
  if (!h.length) return 0;
  let hit = 0;
  for (const w of e) {
    if (h.some(x => wordsMatch(w, x))) hit++;
  }
  return hit / e.length;
}

// shared grading: verdict UI + stats recording (used by both voice and typed answers)
function gradeAnswer(heard, expected, resultEl, flatIdx) {
  const score = scoreAnswer(heard, expected);
  let cls, label;
  if (!heard.trim()) { cls = 'bad'; label = '✗ 未识别到内容'; }
  else if (score >= 0.7) { cls = 'ok'; label = '✓ 正确 (' + Math.round(score * 100) + '%)'; }
  else if (score >= 0.4) { cls = 'near'; label = '△ 接近 (' + Math.round(score * 100) + '%)'; }
  else { cls = 'bad'; label = '✗ 不对 (' + Math.round(score * 100) + '%)'; }
  if (flatIdx !== undefined) results[flatIdx] = (cls === 'ok' ? 'ok' : cls === 'near' ? 'near' : 'bad');
  resultEl.innerHTML = '<span class="heard-text">你: ' + esc(heard.trim() || '(无)') + '</span><span class="verdict ' + cls + '">' + label + '</span>';
  refreshStats();
}

function voiceAnswer(micEl, expected, resultEl, flatIdx) {
  stop();
  if (recogActive) { const r = recogActive; try { r.stop(); } catch (e) { /* ignore */ } return; } // second click: end & grade
  micEl.classList.add('listening');
  resultEl.innerHTML = '<span class="heard-text">🎤 正在听…停顿 2 秒自动结束，或再点 🎙 结束作答</span>';

  const finals = []; // each entry: array of alternative transcripts
  let done = false, gotError = false, retried = false, sawAnyInterim = false;
  let lastActivity = Date.now(), startedAt = 0, silenceTimer = null;

  const startRec = continuous => {
    const r = new SR();
    recogActive = r;
    r.lang = 'en-US';
    r.interimResults = true;
    r.continuous = continuous;
    r.maxAlternatives = 3;
    startedAt = Date.now();
    lastActivity = Date.now();
    let interim = '';
    r.onresult = e => {
      lastActivity = Date.now();
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          const alts = [];
          for (let j = 0; j < res.length; j++) alts.push(res[j].transcript);
          finals.push(alts);
        } else {
          interim += res[0].transcript;
        }
      }
      if (interim) sawAnyInterim = true;
      const shown = (finals.map(f => f[0]).join(' ') || interim || '…').trim();
      resultEl.innerHTML = '<span class="heard-text">🎤 ' + esc(shown) + '</span>';
    };
    r.onerror = e => {
      gotError = true;
      finish();
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        resultEl.innerHTML = '<span class="verdict bad">麦克风被拒绝（' + e.error + '）— file:// 打开时 Chrome 无法记住授权，每次都会弹；点允许后<b>再点一次 🎙</b>即可。根治：用 HTTPS 地址打开</span>';
      } else if (e.error === 'no-speech') {
        resultEl.innerHTML = '<span class="verdict bad">没有听到声音（no-speech）— 离麦克风近一点、稍大声再试</span>';
      } else if (e.error === 'audio-capture') {
        resultEl.innerHTML = '<span class="verdict bad">无法访问麦克风设备（audio-capture）— 检查系统是否禁止了该浏览器的麦克风</span>';
      } else if (e.error === 'network') {
        resultEl.innerHTML = '<span class="verdict bad">识别服务网络错误（network）— 检查手机网络后重试</span>';
      } else {
        resultEl.innerHTML = '<span class="verdict bad">识别出错：' + esc(e.error) + '</span>';
      }
    };
    r.onend = finish;
    r.start();
    clearInterval(silenceTimer);
    // auto-end after ~2.5s of silence (continuous mode never ends on its own)
    silenceTimer = setInterval(() => {
      if (Date.now() - lastActivity > 2500) { try { r.stop(); } catch (e) { /* ignore */ } }
    }, 500);
  };

  const finish = () => {
    if (done) return;
    // some Android Chrome builds end continuous mode instantly with no audio — retry once in non-continuous mode
    if (!retried && !gotError && !finals.length && !sawAnyInterim && Date.now() - startedAt < 1500) {
      retried = true;
      try { recogActive.abort(); } catch (e) { /* ignore */ }
      startRec(false);
      return;
    }
    done = true;
    clearInterval(silenceTimer);
    micEl.classList.remove('listening');
    recogActive = null;
    // pick the best-scoring combination of recognition alternatives
    let candidates;
    if (!finals.length) candidates = [''];
    else if (finals.length === 1) candidates = finals[0].slice();
    else {
      const maxAlts = Math.max(...finals.map(f => f.length));
      candidates = [];
      for (let a = 0; a < maxAlts; a++) candidates.push(finals.map(f => f[Math.min(a, f.length - 1)]).join(' '));
    }
    let best = candidates[0] || '', bestScore = -1;
    for (const c of candidates) {
      const s = scoreAnswer(c, expected);
      if (s > bestScore) { bestScore = s; best = c; }
    }
    gradeAnswer(best, expected, resultEl, flatIdx);
  };

  startRec(true);
}

// ---------- player ----------
async function playItem(it, myToken) {
  const gapSec = parseFloat($('gap').value);
  if (it.kind === 'sentence') {
    await speak(it.text);
  } else {
    const qSpeech = isEnglish(it.q) ? it.q : null;
    if (qSpeech) {
      for (const s of splitSentences(it.q)) {
        if (myToken !== token) return;
        await waitWhilePaused(myToken);
        await speak(s);
      }
      if (myToken !== token) return;
      await waitWhilePaused(myToken);
      await sleep(gapSec * 1000);
      if (myToken !== token) return;
      await waitWhilePaused(myToken);
    }
    for (const s of splitSentences(it.a)) {
      if (myToken !== token) return;
      await waitWhilePaused(myToken);
      await speak(s);
    }
  }
}

function isEnglish(s) { return /^[\x00-\xFF\u2014\u2018\u2019\u201C\u201D\u00A0]*$/.test(s); }

// read a single text aloud as an explanation (English)
async function explain(text) {
  stop();
  if (!isEnglish(text)) return;
  setStatus('🔊 讲解');
  try { await speak(text); } catch (e) { /* ignore */ }
  setStatus('就绪');
}

// Chinese explanation: speak with a Chinese TTS voice
function speakCN(text) {
  stop();
  const v = speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang) && /Ting|Tingting|婷| Mei|Yaoyao|female/i.test(v.name))
    || speechSynthesis.getVoices().find(v => /^zh[-_]CN/i.test(v.lang))
    || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
  const parts = text.match(/[^。？！]+[。？！]?/g) || [text];
  setStatus('💡 中文讲解');
  const myToken = ++token;
  (async () => {
    for (const p of parts) {
      if (myToken !== token) return;
      await new Promise(res => {
        const u = new SpeechSynthesisUtterance(p);
        if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'zh-CN'; }
        u.rate = 1.0;
        u.onend = res; u.onerror = res;
        speechSynthesis.speak(u);
      });
    }
    if (myToken === token) setStatus('就绪');
  })();
}

async function play() {
  if (playing && paused) { paused = false; setStatus('播放中'); return; }
  if (playing) return;
  playing = true; paused = false;
  const myToken = ++token;
  setStatus('播放中');
  $('btnPlay').textContent = '⏸ 暂停';
  const flat = currentFlat();
  const seq = (playIndices && playIndices.length) ? playIndices : flat.map((_, i) => i);
  let pos = seq.indexOf(currentIndex);
  if (pos < 0) pos = 0;
  while (true) {
    if (myToken !== token) return;
    currentIndex = seq[pos];
    const it = flat[currentIndex];
    if (!it) break;
    highlight();
    await playItem(it, myToken);
    if (myToken !== token) return;
    await sleep(400);
    if (myToken !== token) return;
    if (pos < seq.length - 1) {
      pos++;
    } else if (repeat) {
      pos = 0;
    } else {
      break;
    }
  }
  if (myToken === token) stop();
}

function pause() {
  paused = true;
  speechSynthesis.pause();
  setStatus('已暂停');
  $('btnPlay').textContent = '▶ 继续';
}

function stop() {
  token++;
  playing = false; paused = false;
  playIndices = null; // leave wrong-list practice mode on stop
  speechSynthesis.cancel();
  setStatus('就绪');
  $('btnPlay').textContent = '▶ 播放';
}

function setStatus(s) {
  const el = $('status');
  el.textContent = (playing && !paused ? '🔊 ' : '') + s;
  el.classList.toggle('playing', playing && !paused);
}

// ---------- stats & explanation ----------
const TIPS = {
  partA: 'Part A 技巧：抓问题开头的关键词 —— What（名词答案）/ Which（二选一）/ How many（数字）/ If（逻辑推理）。答案大多是简短名词短语，答错时先点题目听清楚问什么。',
  partB: 'Part B 技巧：复述题。先整句听懂（点句子朗读），注意连读和语调，再遮住跟读。生词：lantern 灯笼、illustration 插图、winding 蜿蜒、dormitory 宿舍、stain 污渍、parcel 包裹、renovate 翻新。',
  partC: 'Part C 技巧：对话题答案常跟在 because / but / so / actually 后面。先记住问题问的是原因(Why)、时间(When)还是地点(Where)，再对号入座。',
  partD: 'Part D 技巧：每个故事记 3 个要点（起因 → 经过 → 结果），答案都是名词短语。把 6 个故事各读一遍再做题。',
  partF: 'Part F 技巧：万能三段式 —— 亮立场（I prefer...）→ First（理由1 + 例子）→ Second（理由2）→ So 收尾。答错时点"讲解"听一遍范例答案，再用自己的话复述。'
};

function resetResults() { Object.keys(results).forEach(k => delete results[k]); }

function refreshStats() {
  if ($('statsCard').style.display !== 'none') renderStats();
}

function renderStats() {
  const card = $('statsCard');
  const flat = currentFlat();
  let ok = 0, near = 0, bad = 0, unanswered = 0;
  const wrongList = [];
  flat.forEach((it, i) => {
    const v = results[i];
    if (v === 'ok') ok++;
    else if (v === 'near') near++;
    else if (v === 'bad') bad++;
    else unanswered++;
    if (v === 'near' || v === 'bad') wrongList.push({ i, it });
  });
  const answered = ok + near + bad;
  const rate = answered ? Math.round((ok + near * 0.5) / answered * 100) : 0;
  let html = '<div style="font-weight:700;font-size:15px;margin-bottom:2px;">📊 本轮成绩 — ' + esc(DATA[currentPart].title) + '</div>'
    + '<div class="stats-row">'
    + '<div><span class="stat-num">' + flat.length + '</span>总题数</div>'
    + '<div><span class="stat-num ok">' + ok + '</span>✓ 正确</div>'
    + '<div><span class="stat-num near">' + near + '</span>△ 接近</div>'
    + '<div><span class="stat-num bad">' + bad + '</span>✗ 错误</div>'
    + '<div><span class="stat-num">' + unanswered + '</span>未作答</div>'
    + '<div><span class="stat-num">' + rate + '%</span>得分</div>'
    + '</div>';
  if (answered === 0) {
    html += '<div style="font-size:13px;color:var(--muted);">还没有作答记录 —— 用每条后面的 🎙 语音回答，答完这里会统计对错。</div>';
  } else if (wrongList.length) {
    html += '<div style="font-weight:700;font-size:13px;margin:6px 0 2px;">错题 / 不熟（点讲解听解析）</div>';
    wrongList.forEach(w => {
      const label = w.it.kind === 'sentence' ? w.it.text : (isEnglish(w.it.q) ? w.it.q : w.it.a);
      const short = label.length > 60 ? label.slice(0, 60) + '…' : label;
      html += '<div class="wrong-item"><span class="wtxt"><b>' + (w.it.idx + 1) + '.</b> ' + esc(short) + ' <span class="verdict ' + results[w.i] + '">' + (results[w.i] === 'bad' ? '✗' : '△') + '</span></span>'
        + '<button class="btn" style="padding:3px 10px;font-size:12px;" onclick="gotoAndExplain(' + w.i + ')">🔊 听题</button></div>';
    });
    html += '<button class="btn" style="margin-top:8px;" onclick="practiceWrong()">🔁 只练这些错题</button> ';
    html += '<button class="btn" style="margin-top:8px;" onclick="resetRound()">🔄 重新统计</button>';
  } else {
    html += '<div class="verdict ok" style="font-size:14px;">🎉 全部答对！可以切到下一个 Part 了。</div> '
      + '<button class="btn" style="margin-top:8px;" onclick="resetRound()">🔄 重新统计</button>';
  }
  html += '<div class="tips">💡 ' + TIPS[currentPart] + '</div>';
  card.innerHTML = html;
}

// jump to item, reveal it, then play Q -> gap -> A as explanation
function gotoAndExplain(i) {
  stop();
  playIndices = null;
  currentIndex = i;
  const itemEl = document.querySelector('.item[data-i="' + i + '"]');
  if (itemEl) {
    itemEl.querySelectorAll('.q, .a').forEach(el => {
      el.classList.remove('masked');
      const eye = el.querySelector('.eye');
      if (eye) eye.textContent = '🙈';
    });
  }
  highlight();
  play();
}

// play only the wrong/unfamiliar items in order
function practiceWrong() {
  const flat = currentFlat();
  const idxs = [];
  flat.forEach((_, i) => { if (results[i] === 'bad' || results[i] === 'near') idxs.push(i); });
  if (!idxs.length) return;
  stop();
  playIndices = idxs;
  currentIndex = idxs[0];
  highlight();
  play();
}

function resetRound() {
  resetResults();
  renderStats();
}

// ---------- wire up ----------
$('btnPlay').onclick = () => { if (playing && !paused) pause(); else if (playing && paused) { paused = false; speechSynthesis.resume(); setStatus('播放中'); $('btnPlay').textContent = '⏸ 暂停'; } else play(); };
$('btnStop').onclick = stop;
$('btnPrev').onclick = () => { const f = currentFlat(); if (f.length) { currentIndex = (currentIndex - 1 + f.length) % f.length; highlight(); if (playing) { stop(); play(); } } };
$('btnNext').onclick = () => { const f = currentFlat(); if (f.length) { currentIndex = (currentIndex + 1) % f.length; highlight(); if (playing) { stop(); play(); } } };
$('btnRepeat').onclick = () => { repeat = !repeat; $('btnRepeat').textContent = '🔁 循环: ' + (repeat ? '开' : '关'); $('btnRepeat').classList.toggle('active-toggle', repeat); };
$('btnAnswers').onclick = () => {
  hideAnswers = !hideAnswers;
  localStorage.setItem('versant-maskMode', String(hideAnswers));
  $('btnAnswers').textContent = hideAnswers ? '👁 全部显示' : '🙈 全部遮住';
  $('btnAnswers').classList.toggle('active-toggle', !hideAnswers);
  renderList();
};
$('btnStats').onclick = () => {
  const card = $('statsCard');
  const show = card.style.display === 'none';
  card.style.display = show ? '' : 'none';
  $('btnStats').classList.toggle('active-toggle', show);
  if (show) renderStats();
};
$('btnDiag').onclick = async () => {
  const out = $('diagOut');
  out.style.display = '';
  const lines = [];
  const show = () => { out.textContent = lines.join('\n'); };
  lines.push('1. 打开方式: ' + location.protocol + ' — ' + (window.isSecureContext ? '安全上下文 ✓（允许用麦克风）' : '非安全上下文 ✗（浏览器禁止麦克风！）必须用 https:// 或 file:// 打开'));
  lines.push('2. 语音识别 API: ' + (SR_SUPPORTED ? '支持 ✓' : '不支持 ✗'));
  show();
  try {
    const p = await navigator.permissions.query({ name: 'microphone' });
    lines.push('3. 麦克风授权记忆: ' + p.state + (p.state === 'granted' ? ' ✓ 已记住，不会再弹' : (location.protocol === 'file:' ? ' — file:// 打开无法记住，每次都会弹；改用 localhost 或 https 可根治' : ' — 首次使用会询问一次，点允许后记住')));
  } catch (e) {
    lines.push('3. 麦克风授权记忆: 无法查询（' + e.name + '）');
  }
  show();
  lines.push('4. 麦克风采集: 测试中…（若弹出授权请点允许）');
  show();
  try {
    const stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({ audio: true }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT-8s')), 8000))
    ]);
    const track = stream.getAudioTracks()[0];
    lines[lines.length - 1] = '4. 麦克风采集: 通过 ✓（设备: ' + (track && track.label ? track.label : '默认') + '）';
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {
    lines[lines.length - 1] = '4. 麦克风采集: 失败 ✗ — ' + e.name + ': ' + e.message;
  }
  lines.push('5. 实时识别测试: 点击下方"开始识别测试"后说一句英文…');
  show();
  if (!document.getElementById('diagSR')) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.id = 'diagSR';
    b.textContent = '开始识别测试（说一句英文）';
    b.style.marginTop = '6px';
    b.onclick = () => {
      const r = new SR();
      r.lang = 'en-US';
      r.interimResults = true;
      const evts = ['start', 'audiostart', 'speechstart', 'result', 'audioend', 'end', 'error'];
      const log = ['— 事件流 —'];
      evts.forEach(n => { r['on' + n] = e => { log.push(n + (n === 'error' ? ': ' + e.error : '') + (n === 'result' ? ': "' + e.results[e.results.length - 1][0].transcript + '"' : '')); out.textContent = lines.concat(log).join('\n'); }; });
      r.start();
      setTimeout(() => { try { r.stop(); } catch (e) { /* ignore */ } out.textContent = lines.concat(log).join('\n') + '\n（测试结束）'; }, 6000);
    };
    out.after(b);
  }
};
$('rate').oninput = () => { $('rateVal').textContent = parseFloat($('rate').value).toFixed(2); };
$('gap').oninput = () => { $('gapVal').textContent = parseFloat($('gap').value).toFixed(1) + 's'; };
$('scopeSel').onchange = () => { stop(); currentIndex = 0; playIndices = null; resetResults(); renderList(); refreshStats(); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    $('btnPlay').click();
  }
});

$('btnAnswers').textContent = hideAnswers ? '👁 全部显示' : '🙈 全部遮住';
$('btnAnswers').classList.toggle('active-toggle', !hideAnswers);
if (!SR_SUPPORTED) $('hint').textContent = '当前浏览器不支持语音识别（🎙 已隐藏）——请使用 Chrome 或 Safari 打开本页。';
renderTabs();
renderScope();
renderList();
</script>
